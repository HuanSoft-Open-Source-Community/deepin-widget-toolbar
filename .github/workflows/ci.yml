# CI: pull-request 与 main 分支的构建验证
#   - 在 deepin 官方开发镜像 linuxdeepin/beige（crimson = V25 稳定套件）中安装 Build-Depends
#   - CMake Release 构建（panel + tray 两个插件）
#   - QML 静态检查（qmllint，捕获语法/绑定错误）
#   - Debian 二进制打包（build-deb.sh，与发布流程共用同一入口）
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (deepin v25)
    runs-on: ubuntu-latest
    # linuxdeepin/beige = deepin 官方开发镜像；crimson 套件提供 Qt 6 / DTK 6 / dde-shell 2.x
    container:
      image: linuxdeepin/beige:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # deepin V25 稳定套件 crimson（beige 镜像默认 beige 滚动套件仅 dde-shell 1.x）
          printf '%s\n' 'deb https://community-packages.deepin.com/beige/ crimson main commercial community' > /etc/apt/sources.list
          apt-get update -o Acquire::Retries=3
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git \
            debhelper-compat cmake dpkg-dev fakeroot tar \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qt6-l10n-tools \
            libdde-shell-dev libdtk6core-dev libdtk6gui-dev libdtk6widget-dev

      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Check built plugins
        run: |
          test -f build/plugins/org.deepin.ds.widgettoolbar.so
          test -f build/tray/libwidget-toolbar.so
          echo "panel + tray plugins built OK"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-plugins
          path: |
            build/plugins/org.deepin.ds.widgettoolbar.so
            build/tray/libwidget-toolbar.so
          if-no-files-found: error

  qmllint:
    name: QML static check
    runs-on: ubuntu-latest
    container:
      image: linuxdeepin/beige:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install qmllint
        run: |
          # deepin V25 稳定套件 crimson（beige 镜像默认 beige 滚动套件仅 dde-shell 1.x）
          printf '%s\n' 'deb https://community-packages.deepin.com/beige/ crimson main commercial community' > /etc/apt/sources.list
          apt-get update -o Acquire::Retries=3
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qt6-declarative-dev-tools

      - name: Lint package QML files
        # 只按 qmllint 退出码拦截真正的语法/类型错误；dtk/dde-shell 的 qmltypes
        # 未随镜像打包导致的 import/unresolved-type 警告不影响退出码，仅作日志。
        run: |
          export QT_QML_IMPORT_PATH="$(qmake6 -query QT_INSTALL_QML)"
          find panel/package -name '*.qml' -exec sh -c '
            f="$1"
            if ! /usr/lib/qt6/bin/qmllint "$f" >/tmp/qmllint.log 2>&1; then
              echo "QML ERROR: $f"
              grep -E "Error|error:" /tmp/qmllint.log | head -8
              exit 1
            fi
          ' sh {} \;

  package:
    name: Package (.deb)
    runs-on: ubuntu-latest
    container:
      image: linuxdeepin/beige:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # deepin V25 稳定套件 crimson（beige 镜像默认 beige 滚动套件仅 dde-shell 1.x）
          printf '%s\n' 'deb https://community-packages.deepin.com/beige/ crimson main commercial community' > /etc/apt/sources.list
          apt-get update -o Acquire::Retries=3
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git debhelper-compat cmake dpkg-dev fakeroot tar \
            qt6-base-dev qt6-declarative-dev qt6-l10n-tools \
            libdde-shell-dev libdtk6core-dev libdtk6gui-dev libdtk6widget-dev

      - name: Build Debian package
        run: ./build-deb.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb
          if-no-files-found: error