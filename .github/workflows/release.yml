#
# CD: 打 tag（v*）时构建 Debian 二进制包并发布 GitHub Release
#   - 产物 deepin-widget-toolbar_<version>-1_amd64.deb（版本取自 debian/changelog）
#   - 同时上传面板与托盘插件 .so 便于直接调试
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish .deb
    runs-on: ubuntu-latest
    container:
      image: linuxdeepin/beige:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # deepin V25 稳定套件 crimson（beige 镜像默认 beige 滚动套件仅 dde-shell 1.x）
          printf '%s\n' 'deb https://community-packages.deepin.com/beige/ crimson main commercial community' > /etc/apt/sources.list
          apt-get update -o Acquire::Retries=3
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git debhelper-compat cmake dpkg-dev fakeroot tar \
            qt6-base-dev qt6-declarative-dev qt6-l10n-tools \
            libdde-shell-dev libdtk6core-dev libdtk6gui-dev libdtk6widget-dev

      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build plugins
        run: cmake --build build -j"$(nproc)"

      - name: Build Debian package
        run: ./build-deb.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: deepin-widget-toolbar ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.deb

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-plugins
          path: |
            build/plugins/org.deepin.ds.widgettoolbar.so
            build/tray/libwidget-toolbar.so
          if-no-files-found: error